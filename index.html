/*
=========================================================
AUTOMATIC BLOG ENGINE
=========================================================
*/

function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-");
}

function renderPosts() {

  const list = document.getElementById("postList");
  const query = document.getElementById("search").value.toLowerCase().trim();

  const filtered = posts.filter(post => {
    return (
      post.title.toLowerCase().includes(query) ||
      post.category.toLowerCase().includes(query) ||
      post.excerpt.toLowerCase().includes(query)
    );
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">Tidak ada artikel ditemukan.</div>`;
    return;
  }

  list.innerHTML = filtered.map((post, index) => {

    const realIndex = posts.indexOf(post);

    return `
      <article
        class="post-card"
        onclick="openPost(${realIndex})"
      >
        <div class="post-meta">
          ${formatDate(post.date)} · ${post.category}
        </div>

        <h2>${escapeHTML(post.title)}</h2>

        <p>${escapeHTML(post.excerpt)}</p>

        <span class="tag">Baca artikel →</span>
      </article>
    `;

  }).join("");
}

function openPost(index) {

  const post = posts[index];

  if (!post) return;

  document.getElementById("home").style.display = "none";
  document.getElementById("article").classList.add("active");

  document.getElementById("articleMeta").textContent =
    `${formatDate(post.date)} · ${post.category}`;

  document.getElementById("articleTitle").textContent =
    post.title;

  document.getElementById("articleContent").innerHTML =
    post.content;

  /*
    Creates a browser URL like:

    index.html#ai-is-changing-what-makes-a-worker-valuable

    This means visitors can bookmark individual articles.
  */
  window.location.hash = slugify(post.title);

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}

function goHome() {

  document.getElementById("home").style.display = "block";
  document.getElementById("article").classList.remove("active");

  window.location.hash = "";

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

  renderPosts();
}

function formatDate(dateString) {

  const date = new Date(dateString + "T00:00:00");

  return date.toLocaleDateString("id-ID", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
=========================================================
LOAD ARTICLE FROM URL HASH
=========================================================
*/

function loadFromHash() {

  const hash = window.location.hash.replace("#", "");

  if (!hash) {
    goHome();
    return;
  }

  const index = posts.findIndex(
    post => slugify(post.title) === hash
  );

  if (index !== -1) {
    openPost(index);
  } else {
    goHome();
  }
}

window.addEventListener("hashchange", loadFromHash);

renderPosts();
loadFromHash();

</script>
